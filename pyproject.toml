[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cacli"
version = "0.2.0"
description = "Harness and provider CLI for running coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Benjamin Anderson" }]
dependencies = [
    "jsonschema>=4.0",
    "pydantic-monty==0.0.18",
]

[project.scripts]
cacli = "cacli.cli:main"

[project.urls]
Homepage = "https://github.com/taylorai/cacli"
Repository = "https://github.com/taylorai/cacli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cacli = ["dashboard_dist/**", "flow/SKILL.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B904"]

[dependency-groups]
dev = [
    "build==1.6.1",
    "prek==0.4.14",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "twine==7.0.0",
    "ty==0.0.75",
]
